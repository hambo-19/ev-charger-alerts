name: Charger availability poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: charger-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: charger-state-${{ github.run_id }}
          restore-keys: charger-state-

      - name: Run availability check
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python charger_alert.py

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: charger-state-${{ github.run_id }}

      - name: Monthly keep-alive commit
        continue-on-error: true
        run: |
          git config user.name "charger-alert-bot"
          git config user.email "charger-alert-bot@users.noreply.github.com"
          date -u +%Y-%m > keepalive.txt
          git add keepalive.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: monthly keep-alive"
            git pull --rebase origin main
            git push
          fi
