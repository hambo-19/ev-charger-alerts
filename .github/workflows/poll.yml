name: Charger availability poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charger-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run availability check
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: python charger_alert.py

      - name: Monthly keep-alive marker
        run: date -u +%Y-%m > keepalive.txt

      - name: Commit state if changed
        run: |
          git config user.name "charger-alert-bot"
          git config user.email "charger-alert-bot@users.noreply.github.com"
          git add state.json keepalive.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state"
            git push
          fi
